<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

<div class="app-container">
    

    <main class="main-content">
        
        <header class="mobile-header">
            <strong>CertAI</strong> 
        </header>

        <div class="content-wrapper">
            
            <div id="welcome-screen" class="welcome-container">
                <h1>Welcome to <span class="gradient-text">CertAI</span></h1>
                <p class="subtitle">Your personalized certificate verification assistant.</p>

                <div class="suggestion-grid">
                    <div class="card" onclick="useSuggestion('Is this Python certificate valid?')">
                        <h3>Quick Check</h3>
                        <p>Is this Python certificate valid?</p>
                    </div>
                    <div class="card" onclick="useSuggestion('Extract the issuer and date from this file.')">
                        <h3>Extract Data</h3>
                        <p>Get issuer and date details.</p>
                    </div>
                    <div class="card" onclick="useSuggestion('Does this look fake?')">
                        <h3>Fraud Detection</h3>
                        <p>Analyze for potential edits.</p>
                    </div>
                </div>
            </div>

            <div id="chat-history" class="chat-history" style="display: none;">
                </div>

            <div class="input-section">
                
                <div id="file-preview" class="file-preview">
                    <span id="file-name">filename.pdf</span>
                    <button onclick="clearFile()">×</button>
                </div>

                <form id="chat-form" class="input-container">
                    <div class="input-wrapper">
                        <label class="attach-btn" title="Attach Certificate">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                            <input type="file" id="file-input" accept="image/*,.pdf" hidden>
                        </label>

                        <input type="text" id="msg-input" placeholder="Ask about certificates..." autocomplete="off">
                        
                        <button type="submit" class="send-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>
                <p class="disclaimer">CertAI can make mistakes. Verify important info.</p>
            </div>

        </div>
    </main>
</div>

<script>
    const welcomeScreen = document.getElementById('welcome-screen');
    const chatHistory = document.getElementById('chat-history');
    const fileInput = document.getElementById('file-input');
    const filePreview = document.getElementById('file-preview');
    const msgInput = document.getElementById('msg-input');
    let currentFile = null;

    // --- 1. HANDLE SUGGESTIONS ---
    function useSuggestion(text) {
        msgInput.value = text;
        msgInput.focus();
    }
    const fileNameSpan = document.getElementById('file-name');

    // 1. When a file is selected -> Show the container (Button + Name)
    fileInput.addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
            currentFile = this.files[0];
            
            // Update text
            fileNameSpan.textContent = currentFile.name;
            
            // Add class to make the whole div (and button) appear
            filePreview.classList.add('show');
        }
    });

    // 2. When 'X' is clicked -> Hide everything
    function clearFile() {
        // Reset input value so same file can be selected again if needed
        fileInput.value = ''; 
        currentFile = null;
        
        // Clear text (optional, but good for cleanup)
        fileNameSpan.textContent = ""; 
        
        // Remove class to hide the whole div (and button)
        filePreview.classList.remove('show');
    }

    // --- 3. SUBMIT LOGIC ---
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = msgInput.value;
        if (!text && !currentFile) return;

        // UI Transition: Hide Welcome, Show Chat
        welcomeScreen.style.display = 'none';
        chatHistory.style.display = 'flex';

        // Add User Message
        let userHtml = text;
        if (currentFile) userHtml += `<br><small>📎 ${currentFile.name}</small>`;
        addMessage(userHtml, 'user');

        // Prepare Data
        const formData = new FormData();
        formData.append('message', text);
        if (currentFile) formData.append('file', currentFile);

        // Clear Inputs
        msgInput.value = '';
        clearFile();

        // Loading State
        const loaderId = addLoader();

        try {
            const response = await fetch('/chat', { method: 'POST', body: formData });
            const data = await response.json();
            stopLoader(loaderId, data.response);
        } catch (err) {
            stopLoader(loaderId, "⚠️ Error connecting to server.");
        }
    });

    // --- 4. HELPERS ---
    function addMessage(html, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = sender === 'bot' ? 
            `<div class="bot-icon">✳️</div><div class="msg-content">${html}</div>` : 
            `<div class="msg-content">${html}</div>`;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function addLoader() {
        const id = 'loader-' + Date.now();
        const div = document.createElement('div');
        div.className = 'message bot';
        div.innerHTML = `<div class="bot-icon"></div><div class="msg-content" id="${id}"><span class="thinking">Thinking...</span></div>`;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return id;
    }

    function stopLoader(id, text) {
        const el = document.getElementById(id);
        if(!el) return;
        
        // Simple Markdown Parser
        let parsed = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
            
        el.innerHTML = parsed;
    }
</script>

</body>
</html>
